<!DOCTYPE html>
<!--
  交互式粒子光场 · 零依赖 Web 参考实现（Canvas2D）
  与 Python 库实现 particlefx.systems.LightFieldSystem 共享同一套交互语义与配色常量：
    移动=吸引 / 按住=排斥 / 点击=冲击波 / ?seed= 可复现 / 三套配色平滑过渡。
  二者为「同源双实现」：本文件是 Web 端参照，Python 端见 examples/light_field_demo.py。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交互式粒子光场 · Particle Light Field</title>
<style>
  :root{ --fg:#dfe7ff; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#000; }
  /* 画布铺满整屏，双击即开 */
  #stage{ display:block; width:100vw; height:100vh; cursor:crosshair; }

  /* HUD 文字层（不拦截画布交互，除控制面板外） */
  .hud{
    position:fixed; z-index:10; pointer-events:none; user-select:none;
    color:var(--fg); text-shadow:0 1px 3px rgba(0,0,0,.85);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  #hints{ top:14px; left:16px; opacity:.82; letter-spacing:.3px; }
  #stats{ top:14px; right:16px; text-align:right; }
  #stats b{ font-weight:600; font-variant-numeric:tabular-nums; }

  /* 底部控制面板（可交互） */
  #panel{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:10;
    display:flex; align-items:center; gap:12px; pointer-events:auto;
    padding:8px 16px; border-radius:999px; color:var(--fg);
    background:rgba(10,14,28,.55); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    font:12px/1 sans-serif;
  }
  #panel label{ opacity:.8; }
  #panel input[type=range]{ width:180px; accent-color:#5cf; cursor:pointer; }
  #panel .val{ width:42px; text-align:right; font-variant-numeric:tabular-nums; }
  #panel .tag{ padding:2px 9px; border-radius:999px; background:rgba(255,255,255,.08); white-space:nowrap; }

  /* 暂停遮罩 */
  #paused{
    position:fixed; inset:0; z-index:9; display:none;
    align-items:center; justify-content:center; pointer-events:none;
    color:#fff; font:600 28px sans-serif; letter-spacing:6px;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }
  #paused.show{ display:flex; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hints" class="hud">鼠标移动吸引 · 按住排斥 · 点击冲击波 · 空格换色 · R重置 · P暂停 · S保存</div>
<div id="stats" class="hud"><b id="fps">60</b> FPS &nbsp;·&nbsp; <b id="count">1500</b> 粒子</div>
<div id="panel">
  <label>粒子数</label>
  <input id="slider" type="range" min="200" max="3000" step="50" value="1500">
  <span class="val" id="sliderVal">1500</span>
  <span class="tag" id="palTag">Aurora</span>
  <span class="tag" id="stateTag">运行</span>
</div>
<div id="paused">已暂停 · 按 P 继续</div>

<script>
(function(){
  "use strict";

  /* ============================================================
   * 0. 可复现随机数 (mulberry32)
   *    相同 seed 下，每颗粒子的初始属性完全一致 → 画面可复现。
   * ============================================================ */
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // 用 (seed, 粒子序号) 派生每颗粒子独立的确定性随机源
  function hashSeed(seed, i){ return (Math.imul(seed ^ (i * 0x9E3779B1), 0x85EBCA6B) >>> 0); }

  /* ============================================================
   * 1. 读取 ?seed= 参数（缺省随机），并支持固定种子复现
   * ============================================================ */
  const params = new URLSearchParams(location.search);
  let seed = params.has('seed')
    ? (parseInt(params.get('seed'), 10) >>> 0)
    : ((Math.random() * 4294967296) >>> 0);

  /* ============================================================
   * 2. 配色方案：每套含背景、冷色相(cold)、暖色相(warm)
   *    粒子速度低→冷色，速度高→暖色，在二者间连续渐变。
   * ============================================================ */
  const PALETTES = [
    { name:'Aurora', bg:[6, 8, 20],  cold:190, warm:335 }, // 青 → 品红
    { name:'Ember',  bg:[14, 7, 6],  cold:225, warm:28  }, // 蓝 → 橙
    { name:'Toxic',  bg:[4, 12, 9],  cold:165, warm:0   }, // 绿 → 红
  ];
  let palIndex = 0;
  const tgt = () => PALETTES[palIndex];
  // 当前实际色相（用于平滑过渡）；transitioning 标记是否仍在过渡中
  let curCold = tgt().cold, curWarm = tgt().warm, transitioning = false;

  /* ============================================================
   * 3. 物理 / 渲染 配置
   * ============================================================ */
  const MAX_PARTICLES = 3000;   // 数组上限（滑杆最大值）
  const MIN_PARTICLES = 200;    // 自动降粒子下限
  const DAMP        = 0.985;    // 阻尼（每帧基准）
  const ATTRACTION  = 0.55;     // 鼠标引力强度
  const REPULSE     = 1.10;     // 鼠标斥力强度（按住）
  const INFLUENCE   = 240;      // 鼠标影响半径 (px)
  const SOFTEN      = 8;        // 软化项，避免近距奇点
  const COLOR_SPEED = 5.5;      // 映射到暖色所需速度阈值
  const MAX_SPEED   = 14;       // 速度上限，防止数值爆炸
  const FADE_ALPHA  = 0.16;     // 拖尾衰减：越大拖尾越短
  const BUCKETS     = 48;       // 色相分桶数（决定预渲染精灵数量）
  const SPRITE      = 64;       // 光晕精灵像素尺寸

  /* ============================================================
   * 4. 画布与 devicePixelRatio 适配
   * ============================================================ */
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2); // 上限 2，兼顾清晰度与性能
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    // 将绘图坐标系统一为 CSS 像素（后续所有计算都用 W/H、鼠标坐标）
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 用背景色铺底，避免初始透明
    ctx.fillStyle = `rgb(${tgt().bg.join(',')})`;
    ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);

  /* ============================================================
   * 5. 光晕精灵：按色相预渲染一次（绘制时 drawImage，远快于逐粒 gradient）
   * ============================================================ */
  const sprites = [];
  function buildSprites(){
    for(let i = 0; i < BUCKETS; i++){
      const h = curCold + (curWarm - curCold) * (i / (BUCKETS - 1));
      let s = sprites[i];
      if(!s){ s = document.createElement('canvas'); s.width = s.height = SPRITE; sprites[i] = s; }
      const g = s.getContext('2d');
      g.clearRect(0, 0, SPRITE, SPRITE);
      const r = SPRITE / 2;
      const grad = g.createRadialGradient(r, r, 0, r, r, r);
      grad.addColorStop(0,    `hsla(${h},100%,78%,0.95)`);
      grad.addColorStop(0.25, `hsla(${h},100%,62%,0.45)`);
      grad.addColorStop(1,    `hsla(${h},100%,50%,0)`);
      g.fillStyle = grad;
      g.fillRect(0, 0, SPRITE, SPRITE);
    }
  }
  buildSprites(); // 初始构建

  /* ============================================================
   * 6. 粒子系统
   * ============================================================ */
  const particles = [];
  let desiredCount = 1500;  // 滑杆设定的目标数量
  let activeCount  = 1500;  // 实际渲染数量（自动调节，≤ desiredCount）

  function makeParticle(i){
    const rng = mulberry32(hashSeed(seed, i));
    return {
      i,
      x: rng() * W, y: rng() * H,                 // 初始位置（依赖视口，但序列可复现）
      vx: (rng() - 0.5) * 1.2, vy: (rng() - 0.5) * 1.2,
      phase: rng() * Math.PI * 2,                 // 流场相位，制造确定性流动
      size: 6 + rng() * 12,                       // 个体大小
      spd: 0,
    };
  }
  function ensureCount(n){
    n = Math.max(0, Math.min(MAX_PARTICLES, n | 0));
    while(particles.length < n) particles.push(makeParticle(particles.length));
    if(particles.length > n) particles.length = n;
  }
  // R 重置：用同一 seed 重建属性，画面可复现
  function resetParticles(){
    for(let k = 0; k < particles.length; k++){
      const p = particles[k];
      const rng = mulberry32(hashSeed(seed, p.i));
      p.x = rng() * W; p.y = rng() * H;
      p.vx = (rng() - 0.5) * 1.2; p.vy = (rng() - 0.5) * 1.2;
      p.phase = rng() * Math.PI * 2; p.size = 6 + rng() * 12; p.spd = 0;
    }
    if(particles.length === 0) ensureCount(desiredCount);
  }

  /* ============================================================
   * 7. 鼠标 / 触摸交互状态
   *    移动→吸引，按住→排斥，点击→冲击波
   * ============================================================ */
  const mouse = { x: 0, y: 0, active: false, pressed: false };
  const shocks = []; // 冲击波列表 {x, y, r, life, max}

  function pointer(e){
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
  }
  canvas.addEventListener('pointerenter', () => { mouse.active = true; });
  canvas.addEventListener('pointerleave', () => { mouse.active = false; });
  window.addEventListener('pointermove', pointer);
  canvas.addEventListener('pointerdown', (e) => {
    pointer(e);
    mouse.pressed = true;            // 按住 → 排斥
    triggerShock(mouse.x, mouse.y);  // 点击 → 冲击波
  });
  window.addEventListener('pointerup', () => { mouse.pressed = false; });

  function triggerShock(x, y){
    shocks.push({ x, y, r: 0, life: 1, max: INFLUENCE * 1.6 });
    // 给附近粒子一个向外的瞬时冲量
    for(let k = 0; k < activeCount; k++){
      const p = particles[k];
      const dx = p.x - x, dy = p.y - y;
      const d = Math.hypot(dx, dy) || 1;
      const f = 9 * (1 / (1 + d * 0.012));
      p.vx += (dx / d) * f;
      p.vy += (dy / d) * f;
    }
  }

  /* ============================================================
   * 8. 键盘：空格换色 / R重置 / P暂停 / S保存
   * ============================================================ */
  let paused = false;
  const pausedEl = document.getElementById('paused');
  const stateTag = document.getElementById('stateTag');

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if(k === ' ' || e.code === 'Space'){ e.preventDefault(); cyclePalette(); }
    else if(k === 'r'){ resetParticles(); }
    else if(k === 'p'){ paused = !paused; pausedEl.classList.toggle('show', paused); stateTag.textContent = paused ? '暂停' : '运行'; }
    else if(k === 's'){ savePNG(); }
  });

  function cyclePalette(){
    palIndex = (palIndex + 1) % PALETTES.length;
    transitioning = true;                       // 触发平滑过渡
    document.getElementById('palTag').textContent = tgt().name;
  }

  function savePNG(){
    const a = document.createElement('a');
    a.download = `particle-lightfield_seed${seed}_${Date.now()}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  /* ============================================================
   * 9. 粒子数滑杆（手动调节，设定 desiredCount 上限）
   * ============================================================ */
  const slider = document.getElementById('slider');
  const sliderVal = document.getElementById('sliderVal');
  slider.addEventListener('input', () => {
    desiredCount = +slider.value;
    sliderVal.textContent = desiredCount;
    ensureCount(desiredCount);
    if(activeCount > desiredCount) activeCount = desiredCount;
    document.getElementById('count').textContent = activeCount;
  });

  /* ============================================================
   * 10. 物理更新（dt 归一化，保证不同帧率下行为一致）
   * ============================================================ */
  function update(dt){
    const df = Math.min(dt / 16.667, 2.2);     // 帧率归一系数
    const damp = Math.pow(DAMP, df);
    const t = performance.now() * 0.001;
    const pal = tgt();

    // 配色平滑过渡：仅在过渡期重建精灵，稳态不浪费 CPU
    if(transitioning){
      curCold += (pal.cold - curCold) * 0.06;
      curWarm += (pal.warm - curWarm) * 0.06;
      if(Math.abs(pal.cold - curCold) < 0.4 && Math.abs(pal.warm - curWarm) < 0.4){
        curCold = pal.cold; curWarm = pal.warm; transitioning = false;
      }
      buildSprites();
    }

    const infl2 = INFLUENCE * INFLUENCE;
    const sign = mouse.pressed ? -1 : 1;                 // 按住→斥力
    const strength = mouse.pressed ? REPULSE : ATTRACTION;

    for(let k = 0; k < activeCount; k++){
      const p = particles[k];

      // (a) 确定性环境流场：让画面持续流动且不依赖随机（可复现）
      let ax = Math.cos(p.y * 0.012 + t * 0.35 + p.phase) * 0.018;
      let ay = Math.sin(p.x * 0.012 + t * 0.35 + p.phase) * 0.018;

      // (b) 鼠标力场（引力/斥力，随距离衰减）
      if(mouse.active){
        const dx = mouse.x - p.x, dy = mouse.y - p.y;
        const d2 = dx * dx + dy * dy;
        if(d2 < infl2){
          const d = Math.sqrt(d2) || 1;
          const fall = 1 - d / INFLUENCE;               // 越近越强
          const f = strength * fall / (d + SOFTEN);
          ax += (dx / d) * f * sign;
          ay += (dy / d) * f * sign;
        }
      }

      // (c) 速度积分 + 阻尼（惯性）
      p.vx = (p.vx + ax * df) * damp;
      p.vy = (p.vy + ay * df) * damp;

      // (d) 限速，防爆炸
      const sp = Math.hypot(p.vx, p.vy);
      if(sp > MAX_SPEED){ const s = MAX_SPEED / sp; p.vx *= s; p.vy *= s; }

      // (e) 位移
      p.x += p.vx * df;
      p.y += p.vy * df;

      // (f) 边界软反弹（保持粒子在屏内）
      if(p.x < 0){ p.x = 0; p.vx *= -0.7; } else if(p.x > W){ p.x = W; p.vx *= -0.7; }
      if(p.y < 0){ p.y = 0; p.vy *= -0.7; } else if(p.y > H){ p.y = H; p.vy *= -0.7; }

      p.spd = sp;
    }

    // 冲击波环推进与回收
    for(let i = shocks.length - 1; i >= 0; i--){
      const s = shocks[i];
      s.r += 9 * df; s.life -= 0.02 * df;
      if(s.life <= 0 || s.r > s.max) shocks.splice(i, 1);
    }
  }

  /* ============================================================
   * 11. 渲染：半透明背景覆盖产生拖尾 + 'lighter' 叠加发光
   * ============================================================ */
  function render(){
    const pal = tgt();

    // 拖尾：用半透明背景色覆盖整屏（source-over）
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(${pal.bg[0]},${pal.bg[1]},${pal.bg[2]},${FADE_ALPHA})`;
    ctx.fillRect(0, 0, W, H);

    // 发光叠加：每颗粒子按其速度在冷暖色间取色相桶
    ctx.globalCompositeOperation = 'lighter';
    for(let k = 0; k < activeCount; k++){
      const p = particles[k];
      const tt = Math.min((p.spd || 0) / COLOR_SPEED, 1);   // 0=冷 1=暖
      const bucket = Math.min(BUCKETS - 1, (tt * (BUCKETS - 1)) | 0);
      const sz = p.size * (0.8 + tt * 0.7);                 // 越快越大越亮
      ctx.globalAlpha = 0.55 + tt * 0.35;
      ctx.drawImage(sprites[bucket], p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;

    // 冲击波可视化环
    for(const s of shocks){
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(180,220,255,${Math.max(0, s.life) * 0.5})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  /* ============================================================
   * 12. FPS 统计与掉帧自动降粒子
   * ============================================================ */
  let frames = 0, acc = 0, fps = 60;
  const fpsEl = document.getElementById('fps');
  const countEl = document.getElementById('count');

  function tickFps(dt){
    frames++; acc += dt;
    if(acc >= 0.5){
      fps = frames / acc; frames = 0; acc = 0;
      fpsEl.textContent = Math.round(fps);
      // 掉帧→降粒子；恢复→回升（不超过滑杆目标）
      if(fps < 45 && activeCount > MIN_PARTICLES){
        activeCount = Math.max(MIN_PARTICLES, activeCount - 50);
      } else if(fps > 57 && activeCount < desiredCount){
        activeCount = Math.min(desiredCount, activeCount + 50);
      }
      countEl.textContent = activeCount + (activeCount < desiredCount ? '*' : '');
    }
  }

  /* ============================================================
   * 13. 主循环
   * ============================================================ */
  let last = performance.now();
  function loop(now){
    let dt = now - last; last = now;
    if(dt > 100) dt = 100;       // 防止后台切回时大跳变
    tickFps(dt);
    if(!paused){
      update(dt);
      render();
    }
    requestAnimationFrame(loop);
  }

  /* ============================================================
   * 14. 启动
   * ============================================================ */
  resize();
  ensureCount(desiredCount);
  activeCount = desiredCount;
  document.getElementById('palTag').textContent = tgt().name;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
